apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-billing-service-config
  labels:
    app: oficina-billing-service
data:
  NODE_ENV: "production"
  PORT: "3000"
  AWS_REGION: "us-east-1"
  OUTBOX_PUBLISH_INTERVAL_MS: "5000"
  OUTBOX_BATCH_SIZE: "50"
  OUTBOX_PUBLISHER_ENABLED: "true"
  # Exige SQS_QUEUE_URL no Secret (fila criada pelo terraform/ deste repo).
  SQS_CONSUMER_ENABLED: "true"
  SQS_WAIT_TIME_SECONDS: "20"
  SQS_VISIBILITY_TIMEOUT_SECONDS: "30"
  SQS_MAX_MESSAGES: "10"
  # Gateway simulado: checkout_url publico (API Gateway) e webhook interno.
  GATEWAY_PUBLIC_BASE_URL: "https://7eu2kz40xj.execute-api.us-east-1.amazonaws.com/prod"
  PAYMENT_WEBHOOK_URL: "http://oficina-billing-service.prod.svc.cluster.local/billing/webhooks/pagamento"
  # Adapter de pagamento -> gateway simulado (chamada interna ao cluster).
  GATEWAY_INTERNAL_BASE_URL: "http://oficina-billing-service.prod.svc.cluster.local/gateway"
