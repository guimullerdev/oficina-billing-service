# Placeholder values for local/dev use only. In staging/production, create this
# Secret out-of-band (kubectl create secret / sealed-secrets / external-secrets) -
# never commit real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-billing-service-secret
  labels:
    app: oficina-billing-service
type: Opaque
stringData:
  DATABASE_URL: "postgresql://oficina:oficina@oficina-billing-db:5432/oficina_billing_db"
  AWS_ACCESS_KEY_ID: "dummy_access_key_id"
  AWS_SECRET_ACCESS_KEY: "dummy_secret_access_key"
  SNS_TOPIC_ARN: "arn:aws:sns:us-east-1:000000000000:oficina-billing-events"
  SQS_QUEUE_URL: "http://localhost:4566/000000000000/oficina-billing-queue"
  JWT_SECRET: "change-me"
