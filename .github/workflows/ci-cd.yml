name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/oficina-billing-service
  AWS_REGION: us-east-1
  # Precisa bater com var.cluster_name do repo de infra do cluster; este repo so consome.
  CLUSTER_NAME: oficina-cluster

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # `if` de step nao le `secrets` diretamente; o token no env do job
    # permite pular o scan quando o secret nao existe.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # fetch-depth: 0 — o Sonar precisa do historico completo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --ignore-scripts: nenhum script de ciclo de vida de dependencia roda no
      # install; o unico necessario (prisma generate) e chamado explicitamente.
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn prisma generate
      - run: yarn lint:ci
      - run: yarn build
      - run: yarn test:cov

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # Checagens estaticas de Terraform: sem backend S3, sem credenciais AWS.
  terraform-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.x
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  docker-build-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Vazio quando o Dockerfile ainda nao existe (nada foi publicado).
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # hashFiles nao e permitido no `if` do job; o guard e avaliado em step.
      # O Dockerfile chega em outro PR: sem ele, o job termina sem publicar.
      - id: dockerfile
        run: echo "exists=${{ hashFiles('Dockerfile') != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.dockerfile.outputs.exists == 'true'
        id: meta
        run: |
          base=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "image=$base:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}:${{ github.sha }}
            ${{ steps.meta.outputs.base }}:latest

  # Deploy no EKS. Pula (sem falhar) quando faltam credenciais de deploy,
  # DATABASE_URL ou a imagem (Dockerfile ainda ausente).
  deploy:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Secret de environment tem precedencia sobre o do repositorio.
    environment: prod
    env:
      APP_IMAGE: ${{ needs.docker-build-push.outputs.image }}
      NAMESPACE: prod
    steps:
      - uses: actions/checkout@v4

      # `if` de step nao le `secrets`; o gate expoe um unico output booleano.
      - id: gate
        env:
          HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && 'true' || 'false' }}
          HAS_DATABASE: ${{ secrets.DATABASE_URL != '' && 'true' || 'false' }}
        run: |
          run=true
          if [ "$HAS_AWS" != "true" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID nao configurado; deploy pulado."
            run=false
          fi
          if [ "$HAS_DATABASE" != "true" ]; then
            echo "::warning::DATABASE_URL nao configurada para o environment '$NAMESPACE'; deploy pulado."
            run=false
          fi
          if [ -z "$APP_IMAGE" ]; then
            echo "::warning::Nenhuma imagem publicada (Dockerfile ausente); deploy pulado."
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: steps.gate.outputs.run == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # So usado em conta AWS Academy Learner Lab (credencial temporaria).
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubeconfig
        if: steps.gate.outputs.run == 'true'
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      # Trava contra apontar o deploy para um banco que nao e o do servico.
      # Nada derivado do secret e impresso.
      - name: Conferir se DATABASE_URL aponta para oficina_billing
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # shellcheck disable=SC2016
          DB_NAME=$(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).pathname.slice(1))')
          if [ "$DB_NAME" != "oficina_billing" ]; then
            echo "::error::DATABASE_URL do environment '$NAMESPACE' nao aponta para o banco 'oficina_billing'. Confira o secret desse environment."
            exit 1
          fi
          echo "DATABASE_URL confere com o ambiente $NAMESPACE."

      # O Secret e criado a partir dos secrets do GitHub, nunca de arquivo versionado.
      - name: Publicar Secret da aplicacao
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
          SQS_QUEUE_URL: ${{ secrets.SQS_QUEUE_URL }}
          # Mesmo valor do OS: o guard valida os tokens emitidos por ele.
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Chave do usuario IAM do pod (so mensageria). NAO sao as chaves de
          # deploy do repositorio, que tem AdministratorAccess.
          POD_AWS_ACCESS_KEY_ID: ${{ secrets.POD_AWS_ACCESS_KEY_ID }}
          POD_AWS_SECRET_ACCESS_KEY: ${{ secrets.POD_AWS_SECRET_ACCESS_KEY }}
          # Gateway de pagamento simulado (/gateway) e assinatura do webhook.
          GATEWAY_CLIENT_ID: ${{ secrets.GATEWAY_CLIENT_ID }}
          GATEWAY_CLIENT_SECRET: ${{ secrets.GATEWAY_CLIENT_SECRET }}
          GATEWAY_JWT_SECRET: ${{ secrets.GATEWAY_JWT_SECRET }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
        run: |
          # Sem a chave, o pod cairia na cadeia padrao do SDK e o publisher
          # falharia com AccessDenied: melhor avisar alto no deploy.
          POD_AWS_ARGS=()
          if [ -n "$POD_AWS_ACCESS_KEY_ID" ] && [ -n "$POD_AWS_SECRET_ACCESS_KEY" ]; then
            POD_AWS_ARGS+=(--from-literal=AWS_ACCESS_KEY_ID="$POD_AWS_ACCESS_KEY_ID")
            POD_AWS_ARGS+=(--from-literal=AWS_SECRET_ACCESS_KEY="$POD_AWS_SECRET_ACCESS_KEY")
          else
            echo "::warning::POD_AWS_ACCESS_KEY_ID/POD_AWS_SECRET_ACCESS_KEY ausentes: o pod nao tera credencial AWS (publisher do outbox falhara)."
          fi
          # O app sobe sem eles; so o gateway simulado responde 503.
          GATEWAY_ARGS=()
          GATEWAY_MISSING=()
          for name in GATEWAY_CLIENT_ID GATEWAY_CLIENT_SECRET GATEWAY_JWT_SECRET PAYMENT_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then
              GATEWAY_ARGS+=(--from-literal="$name=${!name}")
            else
              GATEWAY_MISSING+=("$name")
            fi
          done
          if [ "${#GATEWAY_MISSING[@]}" -gt 0 ]; then
            echo "::warning::Secrets do gateway ausentes: ${GATEWAY_MISSING[*]} (endpoints /gateway responderao 503)."
          fi
          # Sem JWT_SECRET o app aborta no boot (fail fast do JwtAuthGuard).
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET ausente no environment prod: o pod nao sobe sem ele."
            exit 1
          fi
          kubectl create secret generic oficina-billing-service-secret \
            --namespace "$NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=SNS_TOPIC_ARN="$SNS_TOPIC_ARN" \
            --from-literal=SQS_QUEUE_URL="$SQS_QUEUE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            "${POD_AWS_ARGS[@]}" \
            "${GATEWAY_ARGS[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar ConfigMap
        if: steps.gate.outputs.run == 'true'
        run: kubectl apply -n "$NAMESPACE" -f k8s/configmap.yaml

      # Migrations antes do rollout: se o schema falhar, a versao nova do
      # codigo nunca sobe contra um banco desatualizado.
      - name: Rodar migrations (Job) e esperar terminar
        if: steps.gate.outputs.run == 'true'
        run: |
          export MIGRATION_JOB_NAME="oficina-billing-migrate-${GITHUB_SHA::7}"
          # shellcheck disable=SC2016
          envsubst '${MIGRATION_JOB_NAME} ${APP_IMAGE}' < k8s/migration-job.yaml | kubectl apply -n "$NAMESPACE" -f -
          if ! kubectl wait -n "$NAMESPACE" --for=condition=complete \
               "job/$MIGRATION_JOB_NAME" --timeout=300s; then
            echo "::error::Migration falhou - rollout abortado. Logs do Job:"
            kubectl logs -n "$NAMESPACE" "job/$MIGRATION_JOB_NAME" --tail=100 || true
            exit 1
          fi

      - name: Aplicar Deployment, Service, Ingress e HPA
        if: steps.gate.outputs.run == 'true'
        run: |
          # shellcheck disable=SC2016
          envsubst '${APP_IMAGE}' < k8s/deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl apply -n "$NAMESPACE" -f k8s/service.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/ingress.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/hpa.yaml

      - name: Aguardar rollout
        if: steps.gate.outputs.run == 'true'
        run: kubectl rollout status -n "$NAMESPACE" deployment/oficina-billing-service --timeout=300s
